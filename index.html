<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلهام — سجلّ التدوينات</title>
<meta name="description" content="سجلّ «إلهام»: تدوينات مختارة من مقاطع دعوية وعلمية — خلاصات، فوائد، وقصص تُلهِم.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F4E79">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/icons/icon-192.png">
<script>
(function(){
  try{
    var t = localStorage.getItem('ilham-theme');
    if(!t){ t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
/* ===== الخطوط المحلية ===== */
@font-face{
  font-family:'Amiri';
  src:url('assets/fonts/Amiri-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Aref Ruqaa';
  src:url('assets/fonts/ArefRuqaa-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Noto Naskh Arabic';
  src:url('assets/fonts/NotoNaskhArabic-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Lemonada';
  src:url('assets/fonts/Lemonada.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Cairo';
  src:url('assets/fonts/Cairo.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Mirza';
  src:url('assets/fonts/Mirza.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Scheherazade New';
  src:url('assets/fonts/ScheherazadeNew.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Reem Kufi';
  src:url('assets/fonts/ReemKufi.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}

/* ===== متغيرات النمط الفاتح ===== */
:root{
  --bg:#F6F3EC;
  --bg-soft:#EFEAE0;
  --card:#FFFFFF;
  --border:#E7E0D2;
  --ink:#262626;
  --muted:#7F7F7F;
  --navy:#1F4E79;
  --navy-deep:#16395C;
  --title:#EE0000;
  --green:#007A33;
  --blue:#2E74B5;
  --warn:#C00000;
  --gold:#C9A227;
  --gold-soft:#E8C96A;
  --link:#0563C1;
  --mark-bg:#FFF59D;
  --mark-ink:#5A4B00;
  --khulasa-txt:#5B2C6F; --khulasa-bg:#EDE7F6; --khulasa-bd:#7E57C2;
  --fiqh-txt:#8A5A00;   --fiqh-bg:#FFF4E5;   --fiqh-bd:#E6A23C;
  --shadow:0 10px 30px rgba(31,78,121,.08), 0 2px 8px rgba(31,78,121,.05);
  --hero-ink:#F4EFE3;
}
:root[data-theme="dark"]{
  --bg:#12161B;
  --bg-soft:#171C22;
  --card:#1A2027;
  --border:#2A323B;
  --ink:#E6E1D6;
  --muted:#9AA3AD;
  --navy:#7FB0DC;
  --navy-deep:#0F2540;
  --title:#FF8A80;
  --green:#57C98B;
  --blue:#74B6E8;
  --warn:#FF8080;
  --gold:#C9A227;
  --gold-soft:#E8C96A;
  --link:#6FB3E8;
  --mark-bg:#5C5416;
  --mark-ink:#FFE98A;
  --khulasa-txt:#CDA9EF; --khulasa-bg:#2C2440; --khulasa-bd:#8E6BD1;
  --fiqh-txt:#E8B96A;   --fiqh-bg:#332A18;   --fiqh-bd:#C98F3D;
  --shadow:0 10px 30px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25);
  --hero-ink:#F4EFE3;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{overflow-x:clip;}
body{
  font-family:var(--app-font);
  background:var(--bg);
  color:var(--ink);
  font-size:17.5px;
  line-height:2.1;
  transition:background .3s ease, color .3s ease;
}
::selection{background:rgba(201,162,39,.35);}

#progress{
  position:fixed; top:0; right:0; height:3px; width:0%;
  background:linear-gradient(90deg,var(--gold),var(--gold-soft));
  z-index:100; transition:width .1s linear;
}

/* ===== الشريط العلوي ===== */
.nav{
  position:sticky; top:0; z-index:70;
  background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1280px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:12px;
}
.brand{display:flex; align-items:baseline; gap:10px; text-decoration:none;}
.brand-name{font-family:'Aref Ruqaa',serif; font-size:1.6rem; color:var(--navy); line-height:1;}
.brand-count{
  font-size:.72rem; color:var(--muted);
  background:var(--bg-soft); border:1px solid var(--border);
  border-radius:999px; padding:0 10px; line-height:1.7;
  white-space:nowrap;
}
.brand-tag{display:none;}
.nav-spacer{flex:1;}
.search-wrap{position:relative;}
.search-wrap svg{
  position:absolute; inset-inline-start:10px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; stroke:var(--muted); pointer-events:none;
}
#search{
  font-family:inherit; font-size:.95rem; color:var(--ink);
  background:var(--card); border:1px solid var(--border);
  border-radius:999px; padding:7px 34px 7px 14px;
  width:220px; max-width:38vw; outline:none;
  transition:border-color .2s, box-shadow .2s, width .25s ease;
}
#search:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,.15);}

/* وضع البحث: الشريط كله يصير بحثاً */
.search-btn{display:inline-flex;}
.search-wrap{display:none;}
body.searching .search-wrap{display:block; flex:1;}
body.searching .search-btn,
body.searching .only-idle{display:none!important;}
body.searching #search{width:100%; max-width:none; font-size:1.05rem; padding:9px 40px 9px 16px;}
/* زر إلغاء البحث — مخفي إلا في وضع البحث (خصوصية أعلى من .icon-btn) */
button.icon-btn.search-close{display:none;}
body.searching button.icon-btn.search-close{display:inline-flex;}

/* قائمة الخطوط المنبثقة */
#fontMenu{
  position:fixed; z-index:95;
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; box-shadow:0 14px 40px rgba(0,0,0,.22);
  padding:6px; min-width:230px; max-height:60vh; overflow-y:auto;
  display:none;
}
#fontMenu.open{display:block;}
#fontMenu button{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:start;
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:1.02rem; color:var(--ink);
  padding:8px 12px; border-radius:9px;
}
#fontMenu button:hover{background:var(--bg-soft);}
#fontMenu button.active{background:color-mix(in srgb, var(--gold) 16%, transparent); font-weight:700;}
#fontMenu button .f-en{font-size:.72rem; color:var(--muted);}

/* تنبيه عائم */
#toast{
  position:fixed; bottom:78px; left:50%; transform:translateX(-50%) translateY(8px);
  background:var(--navy-deep); color:var(--hero-ink);
  border:1px solid var(--gold);
  border-radius:999px; padding:6px 18px;
  font-size:.88rem; z-index:96;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  white-space:nowrap;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* متغيرات الخط: تُطبّق من JS */
:root{--app-font:'Amiri','Geeza Pro','Noto Naskh Arabic','Traditional Arabic',serif; --entry-fs:17.5px;}

/* زر طي/توسيع الكل — أيقونة متغيرة */
.icon-btn .ic-collapse, .icon-btn .ic-expand{display:none;}
.icon-btn.state-expanded .ic-collapse{display:block;}
.icon-btn.state-collapsed .ic-expand{display:block;}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:38px; border-radius:50%;
  background:var(--card); border:1px solid var(--border);
  color:var(--ink); cursor:pointer; flex:none;
  transition:border-color .2s, transform .15s;
}
.icon-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
.icon-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
:root[data-theme="dark"] .icon-sun{display:block;}
:root[data-theme="dark"] .icon-moon{display:none;}
:root[data-theme="light"] .icon-sun{display:none;}
:root[data-theme="light"] .icon-moon{display:block;}

/* زر تثبيت التطبيق — أسفل الشريط الجانبي */
.sb-install{
  margin-top:auto; /* يدفع للأسفل دائماً */
  padding-top:10px;
  border-top:1px solid var(--border);
  display:flex; justify-content:center;
}
.install-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:46px; height:46px; /* أيقونة فقط */
  border-radius:50%;
  background:linear-gradient(150deg, var(--navy-deep), var(--navy));
  border:1.5px solid var(--gold);
  color:var(--gold-soft); cursor:pointer;
  box-shadow:0 4px 12px rgba(31,78,121,.25);
  transition:transform .15s, box-shadow .2s;
}
.install-btn:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(31,78,121,.35);}
.install-btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.install-btn span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);} /* نص مخفي للقارئات */
.install-hint{
  font-size:.78rem; color:var(--muted); text-align:center;
}

/* ===== الترويسة — حُذفت، العدّاد انتقل للشريط العلوي ===== */

/* ===== التخطيط مع الشريط الجانبي ===== */
.layout{
  display:grid; grid-template-columns:minmax(0,1fr);
  max-width:920px; margin:0 auto; padding:16px 20px 26px;
  gap:0 24px; align-items:start;
}
@media (min-width:1001px){
  body.sb-open .layout{max-width:1240px; grid-template-columns:262px minmax(0,1fr);}
  body.sb-open .sidebar{display:flex;}
  body:not(.sb-open) .sidebar{display:none;}
  .sidebar{
    position:sticky; top:72px;
    max-height:calc(100vh - 90px); overflow-y:auto;
  }
}

/* ===== الشريط الجانبي ===== */
.sidebar{
  display:none;
  flex-direction:column; gap:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 12px;
  box-shadow:var(--shadow);
  font-size:.9rem;
}
.sb-head{
  display:flex; align-items:center; justify-content:space-between;
  font-family:'Aref Ruqaa',serif; font-size:1.25rem; color:var(--navy);
}
.sb-close{
  display:none;
  width:30px; height:30px; border-radius:50%;
  border:1px solid var(--border); background:transparent; color:var(--ink);
  cursor:pointer; align-items:center; justify-content:center;
}
.sb-close svg{width:14px; height:14px; stroke:currentColor; stroke-width:2; stroke-linecap:round;}
.sb-section h4{
  font-size:.75rem; color:var(--muted); font-weight:700;
  margin-bottom:4px;
}
.sb-list{list-style:none;}
.sb-list li{margin-bottom:0;}
.sb-link{
  display:flex; align-items:center; gap:7px;
  width:100%; text-align:start;
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:.88rem; color:var(--ink);
  padding:4px 8px; border-radius:8px;
  transition:background .15s, color .15s;
}
.sb-link:hover{background:var(--bg-soft);}
.sb-link.active{background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--ink); font-weight:700;}
.sb-link .cnt{
  margin-inline-start:auto; font-size:.72rem; color:var(--muted);
  background:var(--bg-soft); border-radius:999px; padding:0 8px;
}
.sb-entry-title{
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; line-height:1.55; font-size:.84rem;
}
.sb-entry-num{
  flex:none; width:22px; height:22px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--gold); color:var(--gold);
  border-radius:50%; font-size:.72rem;
}
#tagCloud{gap:5px;}
#tagCloud .chip{font-size:.72rem; padding:1px 9px;}
#tagCloud.collapsed-tags .chip:nth-child(n+6){display:none;}
.sb-clear{
  margin-top:6px; width:100%;
  background:var(--bg-soft); border:1px dashed var(--border);
  color:var(--muted); font-family:inherit; font-size:.85rem;
  border-radius:8px; padding:6px; cursor:pointer;
  display:none;
}
.sb-clear.show{display:block;}
.sb-empty{color:var(--muted); font-size:.85rem;}

/* الجوال: درج جانبي */
.backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
@media (max-width:1000px){
  .sidebar{
    position:fixed; top:0; bottom:0; right:0;
    width:min(252px,74vw); z-index:90;
    border-radius:0; border:none; border-inline-start:1px solid var(--border);
    display:none; overflow-y:auto;
  }
  body.sb-open .sidebar{display:flex; animation:sbIn .22s ease;}
  @keyframes sbIn{from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:none;}}
  body.sb-open .backdrop{opacity:1; pointer-events:auto;}
  .sb-close{display:inline-flex;}
}

/* ===== منطقة التدوينات ===== */
.filter-bar{
  display:none; align-items:center; gap:8px; flex-wrap:wrap;
  background:color-mix(in srgb, var(--gold) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  border-radius:12px; padding:8px 14px; margin-bottom:16px;
  font-size:.88rem;
}
.filter-bar.show{display:flex;}
.filter-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--gold);
  color:var(--ink); border-radius:999px; padding:1px 12px; font-size:.85rem;
}
.filter-chip button{
  background:none; border:none; cursor:pointer; color:var(--warn);
  font-size:1rem; line-height:1; padding:0; font-family:inherit;
}
.count-line{
  text-align:center; color:var(--muted); font-size:.88rem; margin:0 0 12px;
}
.no-results{
  display:none; text-align:center; color:var(--muted);
  background:var(--card); border:1px dashed var(--border);
  border-radius:16px; padding:40px 20px; font-size:1.05rem;
}

/* ===== بطاقة التدوينة ===== */
.entry{
  font-size:var(--entry-fs); /* حجم خط التدوينات فقط — يتغير من الزر */
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px 30px 20px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
  scroll-margin-top:80px;
}
.entry:hover{transform:translateY(-3px);}
.entry.flash{animation:flash 1.6s ease;}
@keyframes flash{
  0%,60%{box-shadow:0 0 0 3px var(--gold), var(--shadow);}
  100%{box-shadow:var(--shadow);}
}

/* السطر الأول: التاريخ يميناً والقائل يساراً */
.entry-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap; margin-bottom:8px;
}
.head-side{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.entry-num{
  width:32px; height:32px; flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  border:1.5px solid var(--gold); color:var(--gold);
  border-radius:50%; font-size:.95rem; line-height:1;
}
.entry-date{
  display:inline-flex; align-items:center; gap:7px;
  background:color-mix(in srgb, var(--navy) 12%, transparent);
  color:var(--navy);
  font-size:.78rem; font-weight:700;
  border-radius:999px; padding:2px 13px;
}
.entry-date svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
/* شارة القائل — بارزة */
.entry-speaker{
  display:inline-flex; align-items:center; gap:7px;
  background:color-mix(in srgb, var(--gold) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--gold) 55%, transparent);
  color:var(--ink); font-weight:700; font-size:.88rem;
  border-radius:999px; padding:3px 14px;
}
.entry-speaker svg{
  width:14px; height:14px; stroke:var(--gold); fill:none;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;
}
.collapse-btn{
  width:30px; height:30px; flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-soft); border:1px solid var(--border);
  border-radius:50%; color:var(--muted); cursor:pointer;
  transition:transform .25s ease, color .15s;
}
.collapse-btn:hover{color:var(--ink);}
.collapse-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.entry.collapsed .collapse-btn{transform:rotate(-180deg);}

.entry-title{
  color:var(--title);
  font-size:1.42em; font-weight:700;
  line-height:1.8;
  margin-bottom:12px;
}
.entry-content{overflow:hidden;}
.entry.collapsed .entry-content{display:none;}
.entry-body p{margin-bottom:13px; text-align:justify;}

/* الصورة المصغرة للمقطع — تطفو أعلى يسار والنص يلتف حولها */
.entry-thumb{
  float:left; /* في RTL: يسار الشاشة */
  width:132px; height:74px;
  margin:4px 16px 8px 0; /* مسافة يمين الصورة نحو النص */
  border-radius:10px;
  border:1px solid var(--border);
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  object-fit:cover;
  display:block;
}
@media (max-width:640px){
  .entry-thumb{width:104px; height:58px; margin:3px 12px 6px 0;}
}

/* زر إظهار كل الوسوم */
.tags-more{
  font-family:inherit; cursor:pointer;
  font-size:.72rem; color:var(--muted);
  background:var(--bg-soft); border:1px dashed var(--border);
  border-radius:999px; padding:2px 10px;
  transition:all .15s;
}
.tags-more:hover{border-color:var(--gold); color:var(--ink);}
/* الوسوم المطوية: أخف ما بعد الرابع */
.entry-meta.collapsed-tags .chip:nth-child(n+5){display:none;}
.entry-meta.collapsed-tags .tags-more::after{content:" …";}

.quran{color:var(--green); font-weight:700;}
.quote{color:var(--blue); font-weight:700;}
.warn{color:var(--warn); font-weight:700;}
mark.concept{
  background:var(--mark-bg); color:var(--mark-ink);
  font-weight:700; padding:0 5px; border-radius:4px;
}

.box{
  border-radius:12px; padding:12px 16px; margin:14px 0 4px;
  border:1px solid; border-inline-start-width:4px;
  font-size:.96em; line-height:1.95;
}
.box-label{
  display:inline-flex; align-items:center; gap:6px;
  font-weight:700; font-size:.83rem; margin-inline-end:8px;
}
.box-label::before{content:"◆"; font-size:.6rem; transform:translateY(-1px);}
.box p{display:inline;}
.box-khulasa{background:var(--khulasa-bg); border-color:var(--khulasa-bd); color:var(--khulasa-txt);}
.box-khulasa .box-label{color:var(--khulasa-txt);}
.box-fiqh{background:var(--fiqh-bg); border-color:var(--fiqh-bd); color:var(--fiqh-txt);}
.box-fiqh .box-label{color:var(--fiqh-txt);}

/* الفئات والوسوم */
.entry-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:14px;
}
.chip{
  font-family:inherit; cursor:pointer;
  font-size:.78rem; border-radius:999px; padding:2px 12px;
  border:1px solid var(--border); background:var(--bg-soft); color:var(--muted);
  transition:all .15s;
}
.chip:hover{border-color:var(--gold); color:var(--ink);}
.chip-cat{
  background:color-mix(in srgb, var(--navy) 12%, transparent);
  border-color:color-mix(in srgb, var(--navy) 35%, transparent);
  color:var(--navy); font-weight:700;
}
.chip-cat:hover{color:var(--navy);}
.chip.active{background:var(--gold); border-color:var(--gold); color:#fff;}

.entry-source{
  margin-top:14px; padding-top:12px;
  border-top:1px dashed var(--border);

<script>
(function(){
  'use strict';

  var DATA = [];
  try{
    DATA = JSON.parse(document.getElementById('ilham-data').textContent);
  }catch(e){ DATA = []; }

  var AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function arNum(n){ return String(n).replace(/\d/g, function(x){ return AR_DIGITS[+x]; }); }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function normalize(s){
    return (s||'')
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g,'ا')
      .replace(/ة/g,'ه')
      .replace(/ى/g,'ي')
      .toLowerCase();
  }
  /* محوّل النص الغني: ﴿﴾ أخضر، «» أزرق، ((())) أحمر، [[]] تظليل أصفر */
  var RICH_RE = /(﴿[^﴾]+﴾|«[^»]+»|\(\([^)]+\)\)|\[\[[^\]]+\]\])/g;
  function rich(s){
    var out='', last=0, m;
    RICH_RE.lastIndex=0;
    while((m = RICH_RE.exec(s))){
      out += esc(s.slice(last, m.index));
      var t = m[0];
      if(t.charAt(0)==='﴿'){ out += '<span class="quran">'+esc(t)+'</span>'; }
      else if(t.charAt(0)==='«'){ out += '<span class="quote">'+esc(t)+'</span>'; }
      else if(t.slice(0,2)==='(('){ out += '<span class="warn">«'+esc(t.slice(2,-2))+'»</span>'; }
      else { out += '<mark class="concept">'+esc(t.slice(2,-2))+'</mark>'; }
      last = m.index + t.length;
    }
    out += esc(s.slice(last));
    return out;
  }

  var ICONS = {
    cal: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    mic: '<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
  };

  var feed = document.getElementById('feed');

  var filterBar = document.getElementById('filterBar');
  var searchInput = document.getElementById('search');

  var activeCat = null, activeTag = null;
  var cards = [];

  /* بناء البطاقات */
  function renderEntries(){
    DATA.forEach(function(e, i){
      var art = document.createElement('article');
      art.className = 'entry';
      art.id = e.id || ('t'+(i+1));
      art.dataset.cat = e.category || '';
      art.dataset.tags = (e.tags||[]).join('|');

      var boxes = (e.boxes||[]).map(function(b){

      var meta = '<div class="entry-meta collapsed-tags">';

        meta += '<button class="chip chip-cat" data-cat="'+esc(e.category)+'" title="تصفية حسب التصنيف">'+esc(e.category)+'</button>';
      }
      (e.tags||[]).forEach(function(t, idx){
        var isSpeaker = (t === e.speaker);

      });
      meta += '<button class="tags-more" data-more>المزيد</button>';
      meta += '</div>';

      var shortUrl = (e.source||'').replace(/^https?:\/\//,'');

      var thumbHtml = e.thumb
        ? '<img class="entry-thumb" src="'+esc(e.thumb)+'" alt="صورة المقطع" loading="lazy">'
        : '';

      art.innerHTML =
        '<div class="entry-head">'+
          '<div class="head-side">'+
            '<span class="entry-num" aria-hidden="true">'+arNum(i+1)+'</span>'+

          '</div>'+

          boxes + meta +
          '<div class="entry-source"><span>المصدر:</span>'+
            '<a href="'+esc(e.source||'#')+'" target="_blank" rel="noopener">'+ICONS.link+esc(shortUrl)+'</a>'+
          '</div>'+
        '</div>';

      feed.insertBefore(art, noResults);
      cards.push(art);
    });

    /* طي/توسيع */
    cards.forEach(function(card){
      var btn = card.querySelector('.collapse-btn');
      btn.addEventListener('click', function(){
        var collapsed = card.classList.toggle('collapsed');
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      });
    });

    /* فرد الوسوم داخل البطاقة */
    feed.addEventListener('click', function(ev){
      var more = ev.target.closest('.tags-more[data-more]');
      if(more){
        var m = more.closest('.entry-meta');
        m.classList.remove('collapsed-tags');
        more.remove();
        return;
      }
      var c = ev.target.closest('.chip');
      if(!c) return;
      if(c.dataset.cat){ setFilter(c.dataset.cat, null); }
      else if(c.dataset.tag){ setFilter(null, c.dataset.tag); }
    });
  }

      li.innerHTML = '<button class="sb-link" data-cat="'+esc(c)+'">'+esc(c)+'<span class="cnt">'+arNum(catMap[c])+'</span></button>';
      catList.appendChild(li);

    var tagCloud = document.getElementById('tagCloud');
    var tagKeys = Object.keys(tagMap).sort();
    tagKeys.forEach(function(t){
      var b = document.createElement('button');
      b.className = 'chip';
      b.dataset.tag = t;
      b.textContent = t + ' ' + arNum(tagMap[t]);
      tagCloud.appendChild(b);
    });
    /* طيّ الوسوم في الفهرس: أخف ما بعد الخامس حتى الضغط على المزيد */
    var sbTagsMore = document.getElementById('sbTagsMore');
    if(tagKeys.length > 5){
      tagCloud.classList.add('collapsed-tags');
      sbTagsMore.style.display = 'inline-block';
      sbTagsMore.addEventListener('click', function(){
        tagCloud.classList.remove('collapsed-tags');
        sbTagsMore.style.display = 'none';
      });
    } else {
      sbTagsMore.style.display = 'none';
    }

    var entryList = document.getElementById('entryList');
    DATA.forEach(function(e, i){
      var li = document.createElement('li');
      li.innerHTML = '<button class="sb-link" data-goto="'+esc(e.id||('t'+(i+1)))+'">'+
        '<span class="sb-entry-num">'+arNum(i+1)+'</span>'+
        '<span class="sb-entry-title">'+esc(e.title||'')+'</span></button>';
      entryList.appendChild(li);
    });

    catList.addEventListener('click', function(ev){
      var b = ev.target.closest('.sb-link'); if(!b) return;
      setFilter(b.dataset.cat === activeCat ? null : b.dataset.cat, null);
    });
    tagCloud.addEventListener('click', function(ev){
      var b = ev.target.closest('.chip'); if(!b) return;
      setFilter(null, b.dataset.tag === activeTag ? null : b.dataset.tag);
    });
    entryList.addEventListener('click', function(ev){
      var b = ev.target.closest('.sb-link'); if(!b) return;
      var target = document.getElementById(b.dataset.goto);
      if(target){
        target.classList.remove('collapsed');
        target.scrollIntoView({behavior:'smooth', block:'start'});
        target.classList.remove('flash'); void target.offsetWidth;
        target.classList.add('flash');
      }
      if(window.innerWidth <= 1000){ toggleSidebar(false); }
    });
  }

  /* التصفية */
  function setFilter(cat, tag){
    activeCat = cat; activeTag = tag;
    applyFilters();
  }
  function applyFilters(){
    var q = normalize(searchInput.value.trim());
    var visible = 0;
    cards.forEach(function(card){
      var okQ = !q || normalize(card.textContent).indexOf(q) !== -1;
      var okC = !activeCat || card.dataset.cat === activeCat;
      var okT = !activeTag || ('|'+card.dataset.tags+'|').indexOf('|'+activeTag+'|') !== -1;
      var show = okQ && okC && okT;
      card.classList.toggle('hidden', !show);
      if(show){ visible++; }
      card.style.display = show ? '' : 'none';
    });

    countLine.textContent = 'تُعرض ' + arNum(visible) + ' من ' + arNum(cards.length) + ' تدوينات';
    noResults.style.display = visible === 0 ? 'block' : 'none';

    /* شريط عوامل التصفية النشطة */
    var parts = [];
    if(activeCat){ parts.push('<span class="filter-chip">التصنيف: '+esc(activeCat)+'<button data-clear="cat" aria-label="إلغاء">×</button></span>'); }
    if(activeTag){ parts.push('<span class="filter-chip">الوسم: '+esc(activeTag)+'<button data-clear="tag" aria-label="إلغاء">×</button></span>'); }
    if(q){ parts.push('<span class="filter-chip">البحث: '+esc(searchInput.value.trim())+'<button data-clear="q" aria-label="إلغاء">×</button></span>'); }
    filterBar.innerHTML = parts.join('');
    filterBar.classList.toggle('show', parts.length > 0);

    /* تمييز الفهرس الجانبي */
    document.querySelectorAll('.sb-link[data-cat]').forEach(function(b){
      b.classList.toggle('active', b.dataset.cat === activeCat);
    });
    document.querySelectorAll('#tagCloud .chip').forEach(function(b){
      b.classList.toggle('active', b.dataset.tag === activeTag);
    });

    var clearBtn = document.getElementById('sbClear');
    clearBtn.classList.toggle('show', !!(activeCat || activeTag || q));
  }

  filterBar.addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-clear]'); if(!b) return;
    if(b.dataset.clear === 'cat'){ activeCat = null; }
    if(b.dataset.clear === 'tag'){ activeTag = null; }
    if(b.dataset.clear === 'q'){ searchInput.value = ''; }
    applyFilters();
  });
  document.getElementById('sbClear').addEventListener('click', function(){
    activeCat = null; activeTag = null; searchInput.value = '';
    applyFilters();
  });
  searchInput.addEventListener('input', applyFilters);

  /* الشريط الجانبي: فتح/طي مع تذكّر الحالة */
  function toggleSidebar(open){
    document.body.classList.toggle('sb-open', open);
    try{ localStorage.setItem('ilham-sb', open ? '1' : '0'); }catch(e){}
  }
  document.getElementById('sbToggle').addEventListener('click', function(){
    toggleSidebar(!document.body.classList.contains('sb-open'));
  });
  document.getElementById('sbClose').addEventListener('click', function(){ toggleSidebar(false); });
  document.getElementById('backdrop').addEventListener('click', function(){ toggleSidebar(false); });

  (function initSidebar(){
    var saved = null;
    try{ saved = localStorage.getItem('ilham-sb'); }catch(e){}
    var open = saved !== null ? saved === '1' : window.innerWidth >= 1001;
    document.body.classList.toggle('sb-open', open);
  })();

  /* النمط الليلي */
  document.getElementById('themeBtn').addEventListener('click', function(){
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('ilham-theme', next); }catch(e){}
  });

  /* شريط التقدم + زر الأعلى */
  var progress = document.getElementById('progress');
  var toTop = document.getElementById('toTop');
  window.addEventListener('scroll', function(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    progress.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    toTop.classList.toggle('show', h.scrollTop > 400);
  }, {passive:true});
  toTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  /* تشغيل */
  document.getElementById('navCount').textContent =
    arNum(DATA.length) + ' تدوينات · ' + arNum(new Set(DATA.map(function(e){return e.category;})).size) + ' فئات';
  renderEntries();
  buildSidebar();
  applyFilters();

  /* ===== طي/توسيع كل التدوينات ===== */
  var collapseAllBtn = document.getElementById('collapseAllBtn');
  collapseAllBtn.classList.add('state-expanded');
  function setAllCollapsed(collapsed){
    cards.forEach(function(card){
      card.classList.toggle('collapsed', collapsed);
      var b = card.querySelector('.collapse-btn');
      if(b){ b.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); }
    });
    collapseAllBtn.classList.toggle('state-expanded', !collapsed);
    collapseAllBtn.classList.toggle('state-collapsed', collapsed);
    try{ localStorage.setItem('ilham-all-collapsed', collapsed ? '1' : '0'); }catch(e){}
  }
  collapseAllBtn.addEventListener('click', function(){
    var anyExpanded = cards.some(function(c){ return !c.classList.contains('collapsed'); });
    setAllCollapsed(anyExpanded);
  });
  (function initCollapseAll(){
    var saved = null;
    try{ saved = localStorage.getItem('ilham-all-collapsed'); }catch(e){}
    if(saved === '1'){ setAllCollapsed(true); }
  })();

  /* ===== وضع البحث ===== */
  var searchBtn = document.getElementById('searchBtn');
  var searchCancel = document.getElementById('searchCancel');
  function enterSearch(){
    document.body.classList.add('searching');
    setTimeout(function(){ searchInput.focus(); }, 50);
  }
  function exitSearch(){
    document.body.classList.remove('searching');
    searchInput.value = '';
    applyFilters();
  }
  searchBtn.addEventListener('click', enterSearch);
  searchCancel.addEventListener('click', exitSearch);
  searchInput.addEventListener('keydown', function(ev){
    if(ev.key === 'Escape'){ exitSearch(); }
  });

  /* ===== الخطوط ===== */
  var FONTS = [
    {name:'أميري', css:"'Amiri','Geeza Pro','Noto Naskh Arabic',serif"},
    {name:'ليمونادة', css:"'Lemonada','Amiri',serif"},
    {name:'النسخ (نوتو)', css:"'Noto Naskh Arabic','Amiri',serif"},
    {name:'القاهرة', css:"'Cairo','Amiri',sans-serif"},
    {name:'مرزة', css:"'Mirza','Amiri',serif"},
    {name:'شهرزاد', css:"'Scheherazade New','Amiri',serif"},
    {name:'ريم كوفي', css:"'Reem Kufi','Amiri',sans-serif"}
  ];
  var curFont = 0;
  try{
    var savedF = parseInt(localStorage.getItem('ilham-font-idx'), 10);
    if(savedF >= 0 && savedF < FONTS.length){ curFont = savedF; }
  }catch(e){}
  function applyFont(idx){
    curFont = (idx + FONTS.length) % FONTS.length;
    document.documentElement.style.setProperty('--app-font', FONTS[curFont].css);
    try{ localStorage.setItem('ilham-font-idx', String(curFont)); }catch(e){}
    document.querySelectorAll('#fontMenu button').forEach(function(b, i){
      b.classList.toggle('active', i === curFont);
    });
  }
  applyFont(curFont);

  var fontBtn = document.getElementById('fontBtn');
  var fontMenu = document.getElementById('fontMenu');
  FONTS.forEach(function(f, i){
    var b = document.createElement('button');
    b.setAttribute('role','menuitem');
    b.innerHTML = '<span style="font-family:'+f.css.replace(/'/g,'&#39;')+'">'+f.name+'</span><span class="f-en">'+f.name+'</span>';
    b.addEventListener('click', function(){ applyFont(i); closeFontMenu(); toast('الخط: ' + f.name); });
    fontMenu.appendChild(b);
  });
  function openFontMenu(){
    var r = fontBtn.getBoundingClientRect();
    fontMenu.classList.add('open');
    var w = fontMenu.offsetWidth;
    var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width/2 - w/2));
    fontMenu.style.left = left + 'px';
    fontMenu.style.top = (r.bottom + 8) + 'px';
  }
  function closeFontMenu(){ fontMenu.classList.remove('open'); }
  document.addEventListener('click', function(ev){
    if(!fontMenu.classList.contains('open')) return;
    if(fontMenu.contains(ev.target) || fontBtn.contains(ev.target)) return;
    closeFontMenu();
  });

  /* ضغطة عادية: الخط التالي — ضغطة مطولة: القائمة */
  var pressTimer = null, longPressed = false;
  fontBtn.addEventListener('pointerdown', function(){
    longPressed = false;
    pressTimer = setTimeout(function(){
      longPressed = true;
      openFontMenu();
    }, 550);
  });
  fontBtn.addEventListener('pointerup', function(){ clearTimeout(pressTimer); });
  fontBtn.addEventListener('pointerleave', function(){ clearTimeout(pressTimer); });
  fontBtn.addEventListener('click', function(ev){
    if(longPressed){ ev.preventDefault(); return; }
    applyFont(curFont + 1);
    toast('الخط: ' + FONTS[curFont].name);
  });
  fontBtn.addEventListener('contextmenu', function(ev){ ev.preventDefault(); openFontMenu(); });

  /* ===== حجم خط التدوينات ===== */
  var SIZES = [15, 16.5, 17.5, 19, 21, 23];
  var curSize = 2;
  try{
    var savedS = parseInt(localStorage.getItem('ilham-font-size'), 10);
    if(savedS >= 0 && savedS < SIZES.length){ curSize = savedS; }
  }catch(e){}
  var sizeBtn = document.getElementById('fontSizeBtn');
  function applySize(idx){
    curSize = (idx + SIZES.length) % SIZES.length;
    document.documentElement.style.setProperty('--entry-fs', SIZES[curSize] + 'px');
    try{ localStorage.setItem('ilham-font-size', String(curSize)); }catch(e){}
    toast('حجم التدوينات: ' + arNum(SIZES[curSize]));
  }
  applySize(curSize);
  sizeBtn.addEventListener('click', function(){ applySize(curSize + 1); });

  /* ===== تنبيه عائم ===== */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ===== PWA: التسجيل وزر التثبيت ===== */
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  var installHint = document.getElementById('installHint');

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    var installed = false;
    try{ installed = localStorage.getItem('ilham-installed') === '1'; }catch(err){}
    if(!installed){ installBtn.hidden = false; installHint.hidden = true; }
  });

  installBtn.addEventListener('click', function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice){
      if(choice && choice.outcome === 'accepted'){
        installBtn.hidden = true;
        installHint.hidden = false;
        try{ localStorage.setItem('ilham-installed','1'); }catch(e){}
      }
      deferredPrompt = null;
    });
  });

  window.addEventListener('appinstalled', function(){
    installBtn.hidden = true;
    installHint.hidden = false;
    try{ localStorage.setItem('ilham-installed','1'); }catch(e){}
  });

  /* iOS Safari: لا يوجد beforeinstallprompt — نخفي الزر ونترك التثبيت من قائمة المشاركة */
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS){
    installBtn.hidden = true;
    var standalone = window.navigator.standalone === true;
    if(!standalone){
      installHint.hidden = false;
      installHint.textContent = 'للتثبيت على الآيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»';
      installHint.style.fontSize = '.7rem';
    }
  }
})();
</script>
</body>
</html>
